name: python verifier

on:
  push:
    paths: ["python/**", "conformance/vectors/**", "corpus/**", "kernel/*.json", ".github/workflows/python.yml"]
  pull_request:
    paths: ["python/**", "conformance/vectors/**", "corpus/**", "kernel/*.json", ".github/workflows/python.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        extras: ["test", "test,fast"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: vectors bundled in the wheel match conformance/vectors
        run: diff -r conformance/vectors python/src/fractalai_pqc_verify/vectors
      - name: build wheel + sdist, install the wheel
        working-directory: python
        run: |
          python -m pip install --upgrade pip build
          python -m build
          python -m pip install "$(ls dist/*.whl)[${{ matrix.extras }}]"
      - name: test the INSTALLED package (offline + live)
        run: |
          cp -R python/tests /tmp/tests && cd /tmp
          python -m pytest -q -o markers="network: live" tests
          fractalai-verify conformance
          fractalai-verify midas
      - name: Trust Kernel v2 corpus — the installed Python port must pass 100 %
        run: python -m fractalai_pqc_verify.kernel.corpus corpus
      - name: baked trust roots identical to the JS kernel
        run: |
          cmp kernel/trust-roots.json python/src/fractalai_pqc_verify/kernel/trust-roots.json
          cmp kernel/checkpoint-directory.json python/src/fractalai_pqc_verify/kernel/checkpoint-directory.json
          cmp kernel/latam-stablecoins.json python/src/fractalai_pqc_verify/kernel/latam-stablecoins.json

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ./python langchain-core crewai
      - run: python python/examples/langchain_tool.py
      - run: python python/examples/crewai_tool.py
