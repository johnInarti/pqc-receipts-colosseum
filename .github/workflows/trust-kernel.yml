name: trust kernel

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  js:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
        working-directory: kernel
      - run: npm ci
        working-directory: corpus
      - run: npm ci
        working-directory: verifier
      - run: npm ci
        working-directory: conformance
      - name: kernel unit tests
        run: npm test
        working-directory: kernel
      - name: corpus is deterministic (regenerated byte-identical)
        run: node corpus/gen.mjs && git diff --exit-code corpus/
      - name: corpus — 100 % required
        run: node corpus/run.mjs
      - name: verifier tests
        run: npm test
        working-directory: verifier
      - name: conformance (golden vectors regenerate byte-identical, 7/7 profiles)
        run: npm test && git diff --exit-code vectors/
        working-directory: conformance
      - name: red-team PoCs replayed (no attack may work)
        run: ./redteam/run-all.sh
  live:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: kernel
      - run: npm ci
        working-directory: corpus
      - name: live positives (production receipt + Arbitrum One + Arc + Solana devnet)
        run: node corpus/run.mjs --live
